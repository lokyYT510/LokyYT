<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anime 3D Register</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    background:#070b17;
    position:relative;
}

/* Animated Background */
body::before{
    content:'';
    position:absolute;
    width:200%;
    height:200%;
    background:
    radial-gradient(circle,#00f7ff33 10%,transparent 20%),
    radial-gradient(circle,#8a2be233 10%,transparent 20%),
    radial-gradient(circle,#ff00cc22 10%,transparent 20%);
    background-size:30% 30%;
    animation:bgMove 20s linear infinite;
    filter:blur(80px);
}

@keyframes bgMove{
    from{
        transform:rotate(0deg);
    }
    to{
        transform:rotate(360deg);
    }
}

/* Floating Coding Text */
.code{
    position:absolute;
    color:#00f7ff55;
    font-size:14px;
    animation:fall linear infinite;
    white-space:nowrap;
}

.code:nth-child(1){
    left:8%;
    animation-duration:12s;
}

.code:nth-child(2){
    left:85%;
    animation-duration:15s;
}

@keyframes fall{
    from{
        transform:translateY(-100vh);
    }
    to{
        transform:translateY(100vh);
    }
}

/* Register Card */
.register-box{
    position:relative;
    width:420px;
    padding:40px;
    border-radius:25px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,0.1);
    box-shadow:
        0 0 30px rgba(0,247,255,0.25),
        inset 0 0 20px rgba(255,255,255,0.05);
    z-index:10;
    animation:float 5s ease-in-out infinite;
}

@keyframes float{
    0%,100%{
        transform:translateY(0px);
    }
    50%{
        transform:translateY(-12px);
    }
}

/* Anime Avatar */
.avatar{
    width:120px;
    height:120px;
    border-radius:50%;
    overflow:hidden;
    margin:auto;
    margin-top:-95px;
    margin-bottom:20px;
    border:4px solid #00f7ff;
    box-shadow:0 0 25px #00f7ff;
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* Heading */
.register-box h2{
    text-align:center;
    color:white;
    margin-bottom:30px;
    letter-spacing:1px;
}

/* Inputs */
.input-box{
    position:relative;
    margin-bottom:22px;
}

.input-box input{
    width:100%;
    padding:15px;
    border:none;
    outline:none;
    border-radius:12px;
    background:rgba(255,255,255,0.08);
    color:white;
    border:1px solid rgba(255,255,255,0.1);
    transition:0.3s;
}

.input-box input:focus{
    border-color:#00f7ff;
    box-shadow:0 0 15px #00f7ff;
}

.input-box label{
    position:absolute;
    left:15px;
    top:50%;
    transform:translateY(-50%);
    color:#aaa;
    pointer-events:none;
    transition:0.3s;
}

.input-box input:focus ~ label,
.input-box input:valid ~ label{
    top:-10px;
    font-size:12px;
    color:#00f7ff;
    background:#070b17;
    padding:0 5px;
}

/* Register Button */
.register-btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:linear-gradient(45deg,#00f7ff,#7b2ff7);
    color:white;
    font-size:16px;
    cursor:pointer;
    font-weight:600;
    letter-spacing:1px;
    transition:0.3s;
}

.register-btn:hover{
    transform:scale(1.03);
    box-shadow:0 0 20px #00f7ff;
}

/* Footer */
.footer{
    margin-top:20px;
    text-align:center;
    color:#bbb;
    font-size:14px;
}

.footer a{
    color:#00f7ff;
    text-decoration:none;
    font-weight:600;
}

.footer a:hover{
    text-shadow:0 0 10px #00f7ff;
}

</style>
</head>
<body>>

<div class="register-box">

    <div class="avatar">
        <img src="https://i.pinimg.com/originals/50/e7/46/50e746ff4e0588126c76d687bf733664.png" alt="Anime Avatar">
    </div>

    <h2>Create Account</h2>

    <form>

        <div class="input-box">
            <input type="text" required>
            <label>Full Name</label>
        </div>

        <div class="input-box">
            <input type="email" required>
            <label>Email Address</label>
        </div>

        <div class="input-box">
            <input type="password" required>
            <label>Password</label>
        </div>

        <div class="input-box">
            <input type="password" required>
            <label>Confirm Password</label>
        </div>

        <button class="register-btn">
            CREATE ACCOUNT
        </button>

        <div class="footer">
            Already have an account?
            <a href="login.html">Login</a>
        </div>

    </form>

</div>

</body>
</html>
