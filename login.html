<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Anime 3D Login</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#080b16;
}

/* Animated Background */
body::before{
    content:'';
    position:absolute;
    width:200%;
    height:200%;
    background:
    radial-gradient(circle at center,#6c5ce7 0%,transparent 25%),
    radial-gradient(circle at top right,#00d2ff 0%,transparent 25%),
    radial-gradient(circle at bottom left,#ff00cc 0%,transparent 25%);
    animation:rotateBg 15s linear infinite;
    filter:blur(80px);
}

@keyframes rotateBg{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
}

/* Glass Card */
.login-box{
    position:relative;
    width:380px;
    padding:40px;
    border-radius:25px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,0.15);
    box-shadow:
        0 0 30px rgba(0,255,255,0.2),
        inset 0 0 20px rgba(255,255,255,0.05);
    z-index:10;
    transform-style:preserve-3d;
    animation:float 5s ease-in-out infinite;
}

@keyframes float{
    0%,100%{transform:translateY(0px);}
    50%{transform:translateY(-15px);}
}

/* Anime Avatar */
.avatar{
    width:120px;
    height:120px;
    margin:auto;
    margin-top:-100px;
    margin-bottom:20px;
    border-radius:50%;
    overflow:hidden;
    border:4px solid #00f7ff;
    box-shadow:0 0 30px #00f7ff;
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* Heading */
.login-box h2{
    color:white;
    text-align:center;
    margin-bottom:30px;
    font-weight:600;
    letter-spacing:1px;
}

/* Inputs */
.input-box{
    position:relative;
    margin-bottom:25px;
}

.input-box input{
    width:100%;
    padding:15px;
    background:rgba(255,255,255,0.08);
    border:none;
    outline:none;
    border-radius:12px;
    color:white;
    font-size:15px;
    border:1px solid rgba(255,255,255,0.1);
    transition:0.3s;
}

.input-box input:focus{
    border-color:#00f7ff;
    box-shadow:0 0 15px #00f7ff;
}

.input-box label{
    position:absolute;
    top:50%;
    left:15px;
    transform:translateY(-50%);
    color:#aaa;
    pointer-events:none;
    transition:0.3s;
}

.input-box input:focus ~ label,
.input-box input:valid ~ label{
    top:-10px;
    left:10px;
    font-size:12px;
    color:#00f7ff;
    background:#080b16;
    padding:0 5px;
}

/* Button */
.login-btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:linear-gradient(45deg,#00f7ff,#6c5ce7);
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
    font-weight:600;
    letter-spacing:1px;
}

.login-btn:hover{
    transform:scale(1.03);
    box-shadow:0 0 20px #00f7ff;
}

/* Footer */
.footer{
    text-align:center;
    margin-top:20px;
    color:#bbb;
    font-size:14px;
}

.footer a{
    color:#00f7ff;
    text-decoration:none;
}

/* Floating Code */
.code{
    position:absolute;
    color:#00f7ff55;
    font-size:14px;
    white-space:nowrap;
    animation:fall linear infinite;
}

.code:nth-child(1){
    left:10%;
    animation-duration:12s;
}

.code:nth-child(2){
    left:80%;
    animation-duration:15s;
}

@keyframes fall{
    from{
        transform:translateY(-100vh);
    }
    to{
        transform:translateY(100vh);
    }
}
</style>
</head>
<body>

<div class="login-box">

    <div class="avatar">
        <img src="https://i.pinimg.com/originals/50/e7/46/50e746ff4e0588126c76d687bf733664.png" alt="Anime Girl">
    </div>

    <h2>Ralz Login</h2>

    <form>

        <div class="input-box">
            <input type="text" required>
            <label>Username</label>
        </div>

        <div class="input-box">
            <input type="password" required>
            <label>Password</label>
        </div>

        <a href="index.html">LOGIN</a>

        <div class="footer">
            New here? <a href="up.html">Create Account</a>
        </div>

    </form>
</div>

</body>
</html>
